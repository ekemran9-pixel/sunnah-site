<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="নবী মুহাম্মাদ ﷺ-এর দৈনিক রুটিন, জীবনী, উপদেশ, করণীয়-বর্জনীয় ও সুন্নাহ ট্র্যাকার।">
<meta name="theme-color" content="#0f5c4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="সুন্নাহর পথে">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>সুন্নাহর পথে</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: phone-first app shell — top app bar, one scrolling screen, fixed bottom tab bar; on wide screens the shell stays a centered phone-width column */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ede7; --fg:#16231f; --muted:#56655f; --line:#d6ddd7;
  --accent:#0f5c4d; --on-accent:#ffffff; --accent-soft:#dcece6; --gold:#9a6a14; --gold-soft:#f4e8cf;
  --lapis:#2a4f8a; --lapis-soft:#e0e8f4;
  --avoid:#a3322a; --avoid-soft:#f6dfdc; --improve:#8a5d0e; --improve-soft:#f4e8cf; --good:#1d6b45; --good-soft:#dcefe3;
  --night:#14233d; --dawn:#5d6f9a; --day:#e3c26a; --dusk:#c9805a; --outer:#e4e9e3;
  --display:"Tiro Bangla","Noto Serif Bengali",serif;
  --body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  --arabic:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  --r:14px; --tabh:64px; --barh:54px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1513; --surface:#16211e; --sunk:#1c2a26; --fg:#e4ebe6; --muted:#9fb0a8; --line:#2b3b36;
  --accent:#5fc2a8; --on-accent:#08231d; --accent-soft:#173630; --gold:#ddb45f; --gold-soft:#3a2e14;
  --lapis:#8fb0ea; --lapis-soft:#1c2a44;
  --avoid:#f08a80; --avoid-soft:#3d1c19; --improve:#ddb45f; --improve-soft:#3a2e14; --good:#6fd39c; --good-soft:#173726;
  --night:#0a1428; --dawn:#3c4c78; --day:#a88a3e; --dusk:#9a5e40; --outer:#080e0c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1513; --surface:#16211e; --sunk:#1c2a26; --fg:#e4ebe6; --muted:#9fb0a8; --line:#2b3b36;
  --accent:#5fc2a8; --on-accent:#08231d; --accent-soft:#173630; --gold:#ddb45f; --gold-soft:#3a2e14;
  --lapis:#8fb0ea; --lapis-soft:#1c2a44;
  --avoid:#f08a80; --avoid-soft:#3d1c19; --improve:#ddb45f; --improve-soft:#3a2e14; --good:#6fd39c; --good-soft:#173726;
  --night:#0a1428; --dawn:#3c4c78; --day:#a88a3e; --dusk:#9a5e40; --outer:#080e0c; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--outer)}
body{background:var(--outer);color:var(--fg);font-family:var(--body);font-size:16.5px;line-height:1.7;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.shell{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.12rem}
p{margin:0}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.saw{font-family:var(--arabic);font-weight:400}
.ar{font-family:var(--arabic);direction:rtl;font-size:1.5rem;line-height:2.05}
.ref{display:block;font-size:.8rem;color:var(--muted)}
.ref::before{content:"সূত্র: "}
.muted{color:var(--muted)}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.05em;color:var(--gold)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--barh);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.bar h1{font-size:1.15rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--fg)}
.icon-btn:active{background:var(--sunk)}
.logo{width:28px;height:28px;flex:none}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs ul{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);list-style:none;padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px));margin-block:0}
.tabs a{height:var(--tabh);display:grid;justify-items:center;align-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.74rem;line-height:1.2}
.tabs a svg{width:24px;height:24px}
.tabs a .ic{padding:3px 16px;border-radius:999px;display:grid;place-items:center}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs a[aria-current="page"] .ic{background:var(--accent-soft)}

main{padding-block:16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px)}
.view{display:grid;gap:18px}
.sec{display:grid;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h a{font-size:.9rem;text-decoration:none}
.lede{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* today */
.hero{border-radius:20px;padding:20px;color:#f2f4f8;display:grid;gap:8px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--sky1),var(--sky2))}
.hero.night{--sky1:#0f1b33;--sky2:#24365e} .hero.dawn{--sky1:#2b3a66;--sky2:#9a6e77} .hero.day{--sky1:#1f6a8a;--sky2:#5e9db4} .hero.dusk{--sky1:#3a2f55;--sky2:#c57a55}
.hero .k{font-size:.82rem;color:#d7dceb}
.hero h2{color:#fff;font-size:1.4rem}
.hero p{color:#e4e8f1}
.hero .go{display:inline-flex;align-items:center;gap:6px;margin-top:4px;color:#ffe6a6;text-decoration:none;font-weight:600}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.hero > *{position:relative}
.next{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22)}
.next b{font-size:1.15rem;color:#fff;font-variant-numeric:tabular-nums}
.ptimes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:0}
.pt span{font-size:.82rem;color:var(--muted)}
.pt b{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.pt.cur{background:var(--accent);border-color:var(--accent)}
.pt.cur span,.pt.cur b{color:var(--on-accent)}
.loc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel{flex:1 1 150px;appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 32px 6px 14px;font-size:.9rem;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.progress{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.mini{display:grid;gap:8px;text-decoration:none;color:var(--fg)}
.mini .row{display:flex;justify-content:space-between;align-items:baseline}
.hadith .txt{font-family:var(--display);font-size:1.1rem;line-height:1.75}
.install{display:grid;gap:10px;background:var(--gold-soft);border-radius:var(--r);padding:16px}
.install b{color:var(--gold)}
.status{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:7px 15px;border-radius:999px;cursor:pointer;font-size:.92rem;white-space:nowrap;min-height:40px;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* routine */
.band{position:relative;height:40px;border-radius:10px;overflow:hidden}
.band i{position:absolute;top:0;bottom:0}
.nowline{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);border-radius:2px}
.ticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px}
.acc{display:grid;gap:8px}
.acc details{scroll-margin-top:calc(var(--barh) + env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.acc details.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.acc summary{list-style:none;display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;min-height:56px}
.acc summary::-webkit-details-marker{display:none}
.acc summary .sw{width:10px;height:38px;border-radius:5px;background:var(--c)}
.acc summary .tt{display:grid;gap:0;min-width:0}
.acc summary .tt small{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.acc summary .chev{transition:transform .2s;color:var(--muted)}
.acc details[open] .chev{transform:rotate(180deg)}
.badge{font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);margin-left:6px;vertical-align:2px}
.acc .inner{padding:0 16px 16px;display:grid;gap:14px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);counter-increment:s}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s,bengali);width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:.85rem;font-weight:600}
.steps li > div{min-width:0}
.dua{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.dua .tr{font-style:italic;color:var(--muted)}
.dua .lbl{font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--gold)}
.today{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.today b{color:var(--accent)}
.note{border-left:3px solid var(--gold);background:var(--gold-soft);padding:12px 14px;border-radius:0 12px 12px 0;font-size:.9rem}

/* learn list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list a{display:grid;grid-template-columns:44px 1fr 18px;gap:14px;align-items:center;padding:14px 16px;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--line);min-height:64px}
.list a:last-child{border-bottom:0}
.list a:active{background:var(--sunk)}
.list .li-ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-size:1.2rem}
.list .li-t{display:grid;min-width:0}
.list .li-t small{color:var(--muted);font-size:.85rem;line-height:1.45}

/* islam */
.pillars{display:grid;gap:8px}
.pillar{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.pillar .num{font-family:var(--display);font-size:1.6rem;color:var(--gold);line-height:1.2;text-align:center}
.triad{display:grid;gap:8px}
.triad > div{padding:14px;background:var(--accent-soft);border-radius:12px}
.quote{display:grid;gap:4px;padding-block:12px;border-bottom:1px solid var(--line)}
.quote:last-child{border-bottom:0}

/* seerah */
.timeline{position:relative;padding-left:24px;display:grid}
.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.ev{position:relative;padding-block:12px;display:grid;gap:4px}
.ev::before{content:"";position:absolute;left:-23px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.ev.madinah::before{border-color:var(--lapis)}
.ev.key::before{background:var(--gold);border-color:var(--gold)}
.ev .yr{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .yr b{color:var(--fg)}
.lesson{font-size:.92rem;color:var(--accent)}
.lesson::before{content:"শিক্ষা: ";font-weight:600}

/* family, cases, war */
.fam-sec ul{margin:0;padding-left:1.1em;display:grid;gap:10px}
.case{display:grid;gap:10px}
.case .k{font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--gold);display:block}
.case .pr{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.rules li{padding:12px 14px;border-left:3px solid var(--lapis);background:var(--lapis-soft);border-radius:0 12px 12px 0;display:grid;gap:2px}
.battle{display:grid;gap:4px;padding-block:12px;border-bottom:1px solid var(--line)}
.battle:last-child{border-bottom:0}
.battle .meta{display:flex;flex-wrap:wrap;gap:6px}

/* practice */
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.legend > div{padding:10px;border-radius:12px;font-size:.8rem;line-height:1.4;display:grid;gap:2px}
.legend b{font-size:.92rem}
.lg-avoid{background:var(--avoid-soft)} .lg-avoid b{color:var(--avoid)}
.lg-improve{background:var(--improve-soft)} .lg-improve b{color:var(--improve)}
.lg-good{background:var(--good-soft)} .lg-good b{color:var(--good)}
.search{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);min-height:46px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;border-top:4px solid var(--c)}
.pc.avoid{--c:var(--avoid)} .pc.improve{--c:var(--improve)} .pc.good{--c:var(--good)}
.pc .top{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.76rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.c{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.pc dl{margin:0;display:grid;gap:6px}
.pc dt{font-size:.78rem;font-weight:600;color:var(--muted)}
.pc dd{margin:0;font-size:.95rem}

/* advice */
.adv{display:grid;gap:10px}
.adv article{display:grid;gap:8px}
.adv .txt{font-family:var(--display);font-size:1.06rem;line-height:1.75}
.adv .row{display:flex;justify-content:space-between;align-items:end;gap:8px}
.copy{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px;font-size:.82rem;cursor:pointer;color:var(--muted);flex:none;min-height:36px}

/* tracker */
.ring-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:120px;height:120px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:1.6rem;line-height:1.1}
.ring .v small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted)}
.week{display:flex;gap:6px;align-items:flex-end;height:64px}
.week div{flex:1;display:grid;gap:3px;justify-items:center;font-size:.68rem;color:var(--muted)}
.week span{display:block;width:100%;max-width:22px;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px}
.tgroup{display:grid;gap:2px}
.tgroup h3{font-size:1rem;color:var(--muted);padding:4px 2px}
.titem{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;align-items:start;background:var(--surface);border:1px solid var(--line)}
.titem input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent)}
.titem.done{background:var(--accent-soft);border-color:transparent}
.titem.done .lbl{color:var(--muted);text-decoration:line-through}

.foot{font-size:.82rem;color:var(--muted);display:grid;gap:4px;padding-top:8px}
@media (min-width:600px){ .shell{box-shadow:0 0 0 1px var(--line)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="shell">
  <header class="bar pad">
    <button class="icon-btn" id="backBtn" aria-label="ফিরে যান" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <svg class="logo" id="logo" viewBox="0 0 26 26" aria-hidden="true"><path d="M17 3a10 10 0 1 0 6 17A8 8 0 1 1 17 3z" fill="var(--accent)"/><path d="M20 6l.9 2.1 2.1.9-2.1.9L20 12l-.9-2.1-2.1-.9 2.1-.9z" fill="var(--gold)"/></svg>
    <h1 id="barTitle">সুন্নাহর পথে</h1>
    <button class="icon-btn" id="themeBtn" aria-label="আলো/অন্ধকার থিম বদলান">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
    </button>
  </header>
  <main class="pad" id="app"></main>
</div>
<nav class="tabs" aria-label="প্রধান মেনু"><ul id="tabs"></ul></nav>
<script>
const bnD = "০১২৩৪৫৬৭৮৯";
const bn = s => String(s).replace(/\d/g, d => bnD[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = (s, el=document) => el.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

/* ---------------- DATA ---------------- */

function prayerTimes(date, lat, lng, tz, asrF){
  const d2r=Math.PI/180, r2d=180/Math.PI;
  const sin=x=>Math.sin(x*d2r), cos=x=>Math.cos(x*d2r), tan=x=>Math.tan(x*d2r);
  const asin=x=>Math.asin(x)*r2d, acos=x=>Math.acos(Math.max(-1,Math.min(1,x)))*r2d, atan2=(y,x)=>Math.atan2(y,x)*r2d;
  const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
  let y=date.getFullYear(), m=date.getMonth()+1; const dd=date.getDate();
  if(m<=2){y--;m+=12}
  const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  const jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+dd+B-1524.5-lng/(15*24);
  const sun=j=>{const D=j-2451545, g=fix(357.529+0.98560028*D,360), q=fix(280.459+0.98564736*D,360),
    L=fix(q+1.915*sin(g)+0.020*sin(2*g),360), e=23.439-0.00000036*D, RA=fix(atan2(cos(e)*sin(L),cos(L))/15,24);
    return {decl:asin(sin(e)*sin(L)), eqt:q/15-RA}};
  const mid=t=>fix(12-sun(jd+t).eqt,24);
  const ang=(a,t,ccw)=>{const s=sun(jd+t), v=acos((-sin(a)-sin(s.decl)*sin(lat))/(cos(s.decl)*cos(lat)))/15; return mid(t)+(ccw?-v:v)};
  const asr=(f,t)=>{const s=sun(jd+t); return ang(-Math.atan(1/(f+tan(Math.abs(lat-s.decl))))*r2d,t)};
  let T={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18,isha:18};
  for(let i=0;i<2;i++){
    const p={}; for(const k in T) p[k]=T[k]/24;
    T={fajr:ang(18,p.fajr,1), sunrise:ang(0.833,p.sunrise,1), dhuhr:mid(p.dhuhr), asr:asr(asrF,p.asr), maghrib:ang(0.833,p.maghrib), isha:ang(18,p.isha)};
  }
  const adj=tz-lng/15;
  for(const k in T) T[k]+=adj;
  T.dhuhr+=2/60; T.maghrib+=3/60; // সতর্কতামূলক কয়েক মিনিট
  return T;
}
let PT = null, PT_TOMORROW = null;
function computeTimes(){
  const l=getLoc(), now=new Date(), tm=new Date(now); tm.setDate(tm.getDate()+1);
  PT = prayerTimes(now,l.lat,l.lng,l.tz,getAsr());
  PT_TOMORROW = prayerTimes(tm,l.lat,l.lng,l.tz,getAsr());
}
function hourNow(){
  const l=getLoc(), d=new Date();
  const utc=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;
  return ((utc+l.tz)%24+24)%24;
}
function fmt(h){
  h=((h%24)+24)%24; let H=Math.floor(h), M=Math.round((h-H)*60); if(M===60){H=(H+1)%24;M=0}
  const H12=H%12===0?12:H%12; return bn(`${H12}:${String(M).padStart(2,"0")}`);
}
function dayPart(h){ return h<4?"রাত":h<6?"ভোর":h<12?"সকাল":h<15?"দুপুর":h<17.5?"বিকেল":h<19?"সন্ধ্যা":"রাত" }
function dur(h){ const m=Math.round(h*60), H=Math.floor(m/60), M=m%60; return (H?bn(H)+" ঘণ্টা ":"")+bn(M)+" মিনিট" }

const BLOCK_COLOR = {tahajjud:"var(--night)",fajr:"var(--dawn)",ishraq:"var(--dawn)",duha:"var(--day)",dhuhr:"var(--day)",asr:"var(--dusk)",maghrib:"var(--dusk)",isha:"var(--night)",sleep:"var(--night)"};
function blockTimes(){
  const P=PT, night=(P.fajr+24)-P.maghrib, tah=P.fajr-night/3, f2=P.fajr+Math.min(.5,(P.sunrise-P.fajr)/2);
  return {tahajjud:[tah,P.fajr], fajr:[P.fajr,f2], ishraq:[f2,P.sunrise+1/3], duha:[P.sunrise+1/3,P.dhuhr-.75],
    dhuhr:[P.dhuhr-.75,P.asr], asr:[P.asr,P.maghrib], maghrib:[P.maghrib,P.isha], isha:[P.isha,P.isha+1.5], sleep:[P.isha+1.5,tah+24]};
}
function blockAt(h){
  const bt=blockTimes();
  return ROUTINE.find(b=>{const [s,e]=bt[b.id]; return (h>=s&&h<e)||(h+24>=s&&h+24<e)}) || ROUTINE[ROUTINE.length-1];
}

function nextPrayer(h){
  for(const [k,n] of PRAYERS){ if(k!=="sunrise" && PT[k]>h) return {k,n,t:PT[k],left:PT[k]-h} }
  return {k:"fajr",n:"ফজর",t:PT_TOMORROW.fajr,left:PT_TOMORROW.fajr+24-h};
}
function currentPrayer(h){
  let cur=null; for(const [k] of PRAYERS){ if(k!=="sunrise" && PT[k]<=h) cur=k }
  if(h>=PT.sunrise && h<PT.dhuhr) cur="sunrise";
  return cur || "isha";
}

  <p class="note">যুদ্ধের এই নীতিগুলো রাষ্ট্রীয় কর্তৃপক্ষের অধীনে প্রযোজ্য। ব্যক্তিগতভাবে বা কোনো গোষ্ঠীর নামে সহিংসতা ইসলাম অনুমোদন করে না। “যে ব্যক্তি চুক্তিবদ্ধ অমুসলিমকে হত্যা করে, সে জান্নাতের ঘ্রাণও পাবে না।” (বুখারী ৩১৬৬)</p>
</section>`;

let advTheme = "সব";
R.advice = () => {
  const themes=["সব",...new Set(ADVICE.map(a=>a[0]))];
  const list=ADVICE.filter(a=>advTheme==="সব"||a[0]===advTheme);
  return `<section class="view">
    <div class="chips" role="group" aria-label="বিষয়">${themes.map(t=>`<button class="chip" data-adv="${t}" aria-pressed="${t===advTheme}">${t}</button>`).join("")}</div>
    <div class="adv">${list.map(a=>`<article class="card"><span><span class="pill">${a[0]}</span></span><p class="txt">“${esc(a[1])}”</p><div class="row">${refHTML(a[2])}<button class="copy" data-copy="${esc(a[1]+" — "+bn(a[2]))}">কপি</button></div></article>`).join("")}</div>
  </section>`;
};

let pCat="all", pArea="সব", pQ="";
R.practice = () => `<section class="view">
  <p class="lede">আজ আমরা যা করছি, তার সাথে কুরআন-সুন্নাহর তুলনা।</p>
  <div class="legend">
    <div class="lg-avoid"><b>বর্জনীয়</b><span>ইসলামের পরিপন্থী</span></div>
    <div class="lg-improve"><b>সংশোধন</b><span>করছি, তবে পরিবর্তন দরকার</span></div>
    <div class="lg-good"><b>উত্তম</b><span>সামঞ্জস্যপূর্ণ</span></div>
  </div>
  <input class="search" id="pq" type="search" placeholder="খুঁজুন: সুদ, বিয়ে, নামাজ…" value="${esc(pQ)}" aria-label="অভ্যাস খুঁজুন">
  <div class="chips" role="group" aria-label="ধরন">${[["all","সব"],["avoid","বর্জনীয়"],["improve","সংশোধন"],["good","উত্তম"]].map(([k,n])=>`<button class="chip" data-pcat="${k}" aria-pressed="${pCat===k}">${n}</button>`).join("")}</div>
  <div class="chips" role="group" aria-label="ক্ষেত্র">${AREAS.map(a=>`<button class="chip" data-parea="${a}" aria-pressed="${pArea===a}">${a}</button>`).join("")}</div>
  <p class="muted" id="pcount" style="font-size:.88rem"></p>
  <div class="adv" id="pcards"></div>
</section>`;
function renderPractice(){
  const q=pQ.trim();
  const list=PRACTICE.filter(p=>(pCat==="all"||p.c===pCat)&&(pArea==="সব"||p.a===pArea)&&(!q||(p.t+p.now+p.sun).includes(q)));
  $("#pcount").textContent=`${bn(list.length)}টি বিষয়`;
  $("#pcards").innerHTML = list.length ? list.map(p=>`<article class="pc ${p.c}">
    <div class="top"><span class="pill c">${CATS[p.c]}</span><span class="pill">${p.a}</span></div>
    <h3>${esc(p.t)}</h3>
    <dl><div><dt>আমরা যা করি</dt><dd>${esc(p.now)}</dd></div><div><dt>ইসলাম যা বলে</dt><dd>${esc(bn(p.sun))}</dd></div></dl>
    ${refHTML(p.r)}</article>`).join("") : `<p class="lede">এই খোঁজে কিছু পাওয়া যায়নি। অন্য শব্দ লিখুন বা ফিল্টার বদলান।</p>`;
}

R.tracker = () => `<section class="view">
  <div class="card ring-card">
    <div class="ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--sunk)" stroke-width="11"/><circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16" style="transition:stroke-dashoffset .4s"/></svg><div class="v"><span id="ringV">০/০</span></div></div>
    <div style="display:grid;gap:6px;min-width:0"><span class="muted" style="font-size:.82rem">গত ৭ দিন</span><div class="week" id="week"></div></div>
  </div>
  <p class="muted" style="font-size:.88rem">সব একদিনে নয়; প্রতি সপ্তাহে একটা নতুন অভ্যাস যোগ করুন। টিকগুলো শুধু এই ফোনে সংরক্ষিত থাকে।</p>
  ${TRACK.map(g=>`<div class="tgroup"><h3>${g[0]}</h3>${g[1].map(([id,l,r])=>`<label class="titem" for="${id}"><input type="checkbox" id="${id}" data-t="${id}"><span><span class="lbl">${esc(bn(l))}</span>${refHTML(r)}</span></label>`).join("")}</div>`).join("")}
  <button class="btn ghost" id="resetDay">আজকের টিক মুছুন</button>
</section>`;
function syncTracker(){
  const st=store.get(todayKey(),{}); let n=0;
  TRACK_ALL.forEach(([id])=>{ const el=document.getElementById(id); if(!el) return; el.checked=!!st[id]; el.closest(".titem").classList.toggle("done",!!st[id]); if(st[id]) n++ });
  const tot=TRACK_ALL.length;
  $("#ringArc").style.strokeDashoffset=314.16*(1-n/tot);
  $("#ringV").innerHTML=`${bn(n)}/${bn(tot)}<small>আজকের আমল</small>`;
  const days=["রবি","সোম","মঙ্গল","বুধ","বৃহ","শুক্র","শনি"]; let html="";
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const c=trackCount(d); html+=`<div><span style="height:${Math.max(3,c/tot*46)}px"></span>${days[d.getDay()]}</div>` }
  $("#week").innerHTML=html;
}

function drawStars(){
  const c=$("#stars"); if(!c) return;
  const r=c.getBoundingClientRect(); c.width=r.width; c.height=r.height;
  const x=c.getContext("2d"); let seed=11; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<50;i++){ x.fillStyle=`rgba(255,255,255,${.25+rnd()*.6})`; x.beginPath(); x.arc(rnd()*c.width,rnd()*c.height,rnd()*1.2+.2,0,7); x.fill() }
}

/* ---------------- ROUTER ---------------- */
const app=$("#app");
const currentView = () => { const v=location.hash.slice(1); return R[v]?v:"today" };
function render(keepScroll){
  computeTimes();
  const v=currentView(), isSub=!!SUB[v], tab=isSub?"learn":v;
  $("#tabs").innerHTML=TABS.map(([id,n])=>`<li><a href="#${id}"${id===tab?' aria-current="page"':""}><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg></span>${n}</a></li>`).join("");
  $("#barTitle").textContent = isSub ? SUB[v] : v==="today" ? "সুন্নাহর পথে" : TABS.find(t=>t[0]===v)[1]==="রুটিন" ? "নবীজি ﷺ-এর দৈনিক রুটিন" : v==="guide" ? "পরিস্থিতি অনুযায়ী গাইড" : v==="learn" ? "শিখুন" : "আমার সুন্নাহ ট্র্যাকার";
  $("#backBtn").hidden=!isSub; $("#logo").style.display=isSub?"none":"";
  app.innerHTML=R[v]().replace(/ﷺ/g,'<span class="saw">ﷺ</span>');
  $("#barTitle").innerHTML=$("#barTitle").textContent.replace(/ﷺ/g,'<span class="saw">ﷺ</span>');
  if(v==="practice") renderPractice();
  if(v==="tracker") syncTracker();
  if(v==="today") drawStars();
  if(v==="routine" && !keepScroll){ const el=$("#blk-"+(openBlock||blockAt(hourNow()).id)); if(el) setTimeout(()=>el.scrollIntoView({block:"start",behavior:"instant"}),0); openBlock=null }
}
window.addEventListener("hashchange",()=>{ window.scrollTo(0,0); render() });
$("#backBtn").addEventListener("click",()=>{ location.hash="learn" });

app.addEventListener("click", e=>{
  const t=e.target.closest("[data-open],[data-era],[data-adv],[data-pcat],[data-parea],[data-sit],[data-copy],#resetDay,#installBtn");
  if(!t) return;
  if(t.dataset.open){ openBlock=t.dataset.open; return }
  if(t.dataset.sit){ sitSel=+t.dataset.sit; if(currentView()==="guide"){ e.preventDefault(); render(true); $("#sitOut").scrollIntoView({block:"nearest"}) } return }
  if(t.dataset.era){ seerahEra=t.dataset.era; render(true); return }
  if(t.dataset.adv){ advTheme=t.dataset.adv; render(true); return }
  if(t.dataset.pcat){ pCat=t.dataset.pcat; document.querySelectorAll("[data-pcat]").forEach(b=>b.setAttribute("aria-pressed",b===t)); renderPractice(); return }
  if(t.dataset.parea){ pArea=t.dataset.parea; document.querySelectorAll("[data-parea]").forEach(b=>b.setAttribute("aria-pressed",b===t)); renderPractice(); return }
  if(t.dataset.copy){ const txt=t.dataset.copy; const ok=()=>{t.textContent="কপি হয়েছে"; setTimeout(()=>t.textContent="কপি",1500)};
    try{ navigator.clipboard.writeText(txt).then(ok).catch(()=>selectText(t)) }catch(err){ selectText(t) } return }
  if(t.id==="resetDay"){ store.set(todayKey(),{}); syncTracker(); return }
  if(t.id==="installBtn" && deferredInstall){ deferredInstall.prompt(); deferredInstall.userChoice.finally(()=>{ deferredInstall=null; render(true) }) }
});
function selectText(btn){ const p=btn.closest("article").querySelector(".txt"); const r=document.createRange(); r.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent="নির্বাচিত, কপি করুন" }
app.addEventListener("input", e=>{ if(e.target.id==="pq"){ pQ=e.target.value; renderPractice() } });
app.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.t){ const st=store.get(todayKey(),{}); st[t.dataset.t]=t.checked; store.set(todayKey(),st); syncTracker(); return }
  if(t.id==="asrSel"){ store.set("asr",+t.value); render(true); return }
  if(t.id==="citySel"){
    if(t.value==="__gps"){
      const msg=$("#locMsg"); msg.textContent="অবস্থান খোঁজা হচ্ছে…";
      const fail=()=>{ msg.textContent="অবস্থান পাওয়া যায়নি। অনুমতি দিন অথবা তালিকা থেকে এলাকা বাছুন।"; t.value=getLoc().id };
      try{ navigator.geolocation.getCurrentPosition(p=>{ store.set("loc",{id:"gps",name:"আমার অবস্থান",lat:p.coords.latitude,lng:p.coords.longitude,tz:-new Date().getTimezoneOffset()/60}); render(true) }, fail, {timeout:15000,maximumAge:864e5}) }catch(err){ fail() }
      return;
    }
    const c=CITIES.find(c=>c[0]===t.value); store.set("loc",{id:c[0],name:c[1],lat:c[2],lng:c[3],tz:6}); render(true);
  }
});

$("#themeBtn").addEventListener("click",()=>{
  const root=document.documentElement;
  const dark=root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme=dark?"light":"dark"; store.set("theme",root.dataset.theme);
});
const savedTheme=store.get("theme",null); if(savedTheme) document.documentElement.dataset.theme=savedTheme;
setInterval(()=>{ if(currentView()==="today" && !document.hidden && !document.activeElement.matches("select")) render(true) }, 60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && currentView()==="today") render(true) });
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      navigator.serviceWorker.addEventListener("controllerchange", () => { if (location.hash === "" || location.hash === "#today") render(true) });
    }).catch(() => {});
  });
}
</script>
</body>
